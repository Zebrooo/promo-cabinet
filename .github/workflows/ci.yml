name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    runs-on: [self-hosted, ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Export NODE_AUTH_TOKEN (для приватных @zebrooo/*)
        run: echo "NODE_AUTH_TOKEN=$(cat ~/.abkhaz-deploy-token)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  test:
    runs-on: [self-hosted, ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Export NODE_AUTH_TOKEN (для приватных @zebrooo/*)
        run: echo "NODE_AUTH_TOKEN=$(cat ~/.abkhaz-deploy-token)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
