name: promo-cabinet

# Кабинет — единственный из промо-связки, кому НУЖЕН публичный маршрут (в него
# ходят люди браузером). Поэтому, в отличие от promo-bff, здесь есть
# Traefik-метки; но ports: на хост по-прежнему нет — наружу отдаёт только
# Traefik по своему маршруту, с TLS от letsencrypt.
#
# BFF кабинет достаёт по имени контейнера через общую сеть web —
# PROMO_BFF_URL=http://promo-bff:3191 (правится в .env при переносе,
# на eremin.site было http://127.0.0.1:3191).

services:
  promo-cabinet:
    container_name: promo-cabinet
    image: promo-cabinet:latest
    build:
      context: .
      secrets:
        - node_auth_token
    restart: always
    env_file:
      - .env
    networks:
      - web
    labels:
      - traefik.enable=true
      # admin.eremin.site — общая админка (решение 2026-07-28): настройка
      # промо, пульт деплоя abkhaz-auto, метрики/аналитика. Идея с
      # promo.abkhaz-auto.ru отменена в тот же день (на зоне Timeweb wildcard
      # на чужой сервер, и юзер предпочёл свой домен) — abkhaz-роутеры сняты,
      # DNS-запись promo.abkhaz-auto.ru так и не заводилась.
      - traefik.http.routers.promo-cabinet.rule=Host(`admin.eremin.site`)
      - traefik.http.routers.promo-cabinet.entrypoints=websecure
      - traefik.http.routers.promo-cabinet.tls.certresolver=letsencrypt
      - traefik.http.services.promo-cabinet.loadbalancer.server.port=3190
      # HTTP→HTTPS для основного домена.
      - traefik.http.middlewares.promo-cabinet-https.redirectscheme.scheme=https
      - traefik.http.middlewares.promo-cabinet-https.redirectscheme.permanent=true
      - traefik.http.routers.promo-cabinet-http.rule=Host(`admin.eremin.site`)
      - traefik.http.routers.promo-cabinet-http.entrypoints=web
      - traefik.http.routers.promo-cabinet-http.middlewares=promo-cabinet-https
      # promo-admin.eremin.site — 301 на новый адрес (закладки). Снести после
      # пары недель тишины по хосту в логах Traefik.
      - traefik.http.middlewares.promo-cabinet-to-admin.redirectregex.regex=^https?://promo-admin\.eremin\.site/(.*)
      - traefik.http.middlewares.promo-cabinet-to-admin.redirectregex.replacement=https://admin.eremin.site/$${1}
      - traefik.http.middlewares.promo-cabinet-to-admin.redirectregex.permanent=true
      - traefik.http.routers.promo-cabinet-legacy.rule=Host(`promo-admin.eremin.site`)
      - traefik.http.routers.promo-cabinet-legacy.entrypoints=websecure
      - traefik.http.routers.promo-cabinet-legacy.tls.certresolver=letsencrypt
      - traefik.http.routers.promo-cabinet-legacy.service=promo-cabinet
      - traefik.http.routers.promo-cabinet-legacy.middlewares=promo-cabinet-to-admin
      - traefik.http.routers.promo-cabinet-legacy-http.rule=Host(`promo-admin.eremin.site`)
      - traefik.http.routers.promo-cabinet-legacy-http.entrypoints=web
      - traefik.http.routers.promo-cabinet-legacy-http.middlewares=promo-cabinet-to-admin
    healthcheck:
      # Логин-страница отдаёт 200 без авторизации — годится как проба живости.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3190/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"

networks:
  web:
    external: true

secrets:
  node_auth_token:
    environment: NODE_AUTH_TOKEN
